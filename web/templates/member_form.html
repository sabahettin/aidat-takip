{{define "member_form"}}
<!DOCTYPE html>
<html lang="tr">
<head><title>{{if .IsNew}}Yeni Üye{{else}}Üye Düzenle{{end}} · Aidat Takip</title>{{template "head" .}}</head>
<body>
{{template "nav" .}}
<main class="container container-narrow">
  <h1>{{if .IsNew}}Yeni Üye{{else}}Üye Düzenle{{end}}</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form method="post" action="{{.FormURL}}" class="form">
    <label>Ad Soyad
      <input type="text" name="full_name" value="{{.Member.FullName}}" required>
    </label>
    <label>Telefon
      <input type="text" name="phone" value="{{.Member.Phone}}">
    </label>
    <label>E-posta
      <input type="email" name="email" value="{{.Member.Email}}">
    </label>
    <label>Katılım Tarihi
      <input type="date" name="join_date" value="{{.Member.JoinDate}}" required>
    </label>
    <label>Aylık Aidat (₺)
      <input type="number" step="0.01" min="0" name="monthly_fee" value="{{.Member.MonthlyFee}}" required>
    </label>
    <label>Not
      <textarea name="note">{{.Member.Note}}</textarea>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Kaydet</button>
      <a href="/uyeler">Vazgeç</a>
    </div>
  </form>
</main>
</body>
</html>
{{end}}
