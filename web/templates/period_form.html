{{define "period_form"}}
<!DOCTYPE html>
<html lang="tr">
<head><title>Dönem Düzenle · Aidat Takip</title>{{template "head" .}}</head>
<body>
{{template "nav" .}}
<main class="container container-narrow">
  <h1>Dönem Düzenle</h1>
  <p class="muted" style="margin-top:-8px">{{.Member.FullName}}</p>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form method="post" action="{{.FormURL}}" class="form">
    <label>Başlangıç Tarihi
      <input type="date" name="start_date" value="{{.Period.StartDate}}" required>
    </label>
    <label>Bitiş Tarihi (opsiyonel)
      <input type="date" name="end_date" value="{{.Period.EndDate}}">
    </label>
    <p class="muted" style="margin-top:0">Boş bırakılırsa dönem hâlâ devam ediyor sayılır.</p>
    <label>Aylık Aidat (₺)
      <input type="number" step="0.01" min="0" name="monthly_fee" value="{{.Period.MonthlyFee}}" required>
    </label>
    <label>Not (opsiyonel)
      <input type="text" name="period_note" value="{{.Period.Note}}">
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Kaydet</button>
      <a href="/uyeler/{{.Member.ID}}" class="btn btn-secondary">Vazgeç</a>
    </div>
  </form>
</main>
</body>
</html>
{{end}}
