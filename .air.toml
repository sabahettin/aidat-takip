root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/aidat-takip ."
  bin = "./tmp/aidat-takip"
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp", "dist", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
